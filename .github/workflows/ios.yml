name: iOS unsigned IPA
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd ios
          xcodegen generate
      - name: Build unsigned device app
        run: |
          xcodebuild -project ios/LocalDrop.xcodeproj -scheme LocalDrop \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' build
      - name: Test file sending on iOS Simulator
        run: |
          SIMULATOR_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for devices in d["devices"].values() for x in devices if x["name"].startswith("iPhone")))')
          xcodebuild test -project ios/LocalDrop.xcodeproj -scheme LocalDrop \
            -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath build/SimulatorTests -resultBundlePath build/FileSendingTests.xcresult \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=''
      - name: Package unsigned IPA
        run: |
          mkdir -p build/package/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/LocalDrop.app build/package/Payload/
          cd build/package
          /usr/bin/zip -qry ../LocalDrop-unsigned.ipa Payload
          unzip -t ../LocalDrop-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: LocalDrop-iOS-unsigned
          path: build/LocalDrop-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
