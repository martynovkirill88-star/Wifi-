name: LocalDrop
options:
  bundleIdPrefix: local.localdrop
  deploymentTarget:
    iOS: '16.2'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    DEVELOPMENT_TEAM: ''
targets:
  LocalDrop:
    type: application
    platform: iOS
    sources: [LocalDrop, Shared]
    dependencies:
      - target: LocalDropActivity
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: LocalDrop
        CFBundleShortVersionString: '$(MARKETING_VERSION)'
        CFBundleVersion: '$(CURRENT_PROJECT_VERSION)'
        UILaunchScreen: {}
        UISupportsDocumentBrowser: false
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSLocalNetworkUsageDescription: Прямая передача файлов между iPhone и вашим компьютером.
        NSBonjourServices: ['_localdrop._tcp']
        NSCameraUsageDescription: Сканирование QR-кода сопряжения с компьютером.
        NSPhotoLibraryUsageDescription: Чтение оригинальных файлов выбранных фото и видео.
        NSPhotoLibraryAddUsageDescription: Сохранение полученных фото и видео в медиатеку.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSSupportsLiveActivities: true
        CFBundleIconFiles: [LocalDropIcon60, LocalDropIcon76]
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleIconFiles: [LocalDropIcon60]
            UIPrerenderedIcon: false
        CFBundleIcons~ipad:
          CFBundlePrimaryIcon:
            CFBundleIconFiles: [LocalDropIcon76, LocalDropIcon83]
            UIPrerenderedIcon: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.localdrop.app
        MARKETING_VERSION: '0.2.2'
        CURRENT_PROJECT_VERSION: '4'
  LocalDropActivity:
    type: app-extension
    platform: iOS
    sources: [LiveWidget, Shared]
    info:
      path: WidgetInfo.plist
      properties:
        CFBundleDisplayName: LocalDrop Transfer
        CFBundleShortVersionString: '$(MARKETING_VERSION)'
        CFBundleVersion: '$(CURRENT_PROJECT_VERSION)'
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.localdrop.app.activity
        MARKETING_VERSION: '0.2.2'
        CURRENT_PROJECT_VERSION: '4'
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  LocalDropTests:
    type: bundle.unit-test
    platform: iOS
    sources: [LocalDropTests]
    dependencies:
      - target: LocalDrop
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: local.localdrop.tests
  LocalDropUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [LocalDropUITests]
    dependencies:
      - target: LocalDrop
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: local.localdrop.uitests
schemes:
  LocalDrop:
    build:
      targets:
        LocalDrop: all
    test:
      targets: [LocalDropTests, LocalDropUITests]
